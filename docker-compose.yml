services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aria
      POSTGRES_PASSWORD: change_me_locally
      POSTGRES_DB: aria
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata: